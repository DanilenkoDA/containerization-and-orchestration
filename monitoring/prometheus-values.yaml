# Override для prometheus-community/prometheus.
# scrape api + Alertmanager + critical alerting rules.

server:
  replicaCount: 1

alertmanager:
  enabled: true
  # Конфиг sub-chart alertmanager: route + receivers.
  # Webhook → in-cluster echo (см. monitoring/webhook-echo.yaml), логи: kubectl logs -n monitoring deploy/webhook-echo
  config:
    enabled: true
    global: {}
    route:
      receiver: lab-webhook
      group_by: ["alertname", "severity"]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
    receivers:
      - name: lab-webhook
        webhook_configs:
          - url: http://webhook-echo.monitoring.svc.cluster.local:8080/
            send_resolved: true
    templates:
      - /etc/alertmanager/*.tmpl

prometheus-pushgateway:
  enabled: false

# Service DNS стабилен при рестартах пода — в отличие от Pod IP.
extraScrapeConfigs: |
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api.lab2.svc.cluster.local:8000

serverFiles:
  alerting_rules.yml:
    groups:
      - name: api.critical
        rules:
          # Target scrape не отвечает — сервис недоступен.
          - alert: ApiScrapeTargetDown
            expr: up{job="api"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "API scrape target is down"
              description: "up{job=\"api\"} == 0 for >1m. Check pod/Service in lab2."
              runbook: "kubectl get pods,svc -n lab2; kubectl logs -n lab2 -l app.kubernetes.io/name=api"

          # Доля 5xx. Реальные метрики api: http_errors_total / http_requests_total.
          - alert: ApiHighErrorRate
            expr: |
              (
                sum(rate(http_errors_total{job="api"}[5m]))
                /
                clamp_min(sum(rate(http_requests_total{job="api"}[5m])), 1e-9)
              ) > 0.1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "API error rate > 5%"
              description: "5xx share above 5% for >1m (job=api)."
              runbook: "Check Grafana RED + Loki {app=\"api\"}; compare /fail vs normal traffic."

          # p95 latency; /health исключаем — probes забивают гистограмму.
          - alert: ApiHighLatency
            expr: |
              histogram_quantile(
                0.95,
                sum by (le) (
                  rate(http_request_duration_seconds_bucket{job="api", endpoint!="/health"}[5m])
                )
              ) > 0.5
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "API p95 latency > 500ms"
              description: "p95 (excluding /health) above 0.5s for >1m."
              runbook: "Jaeger: look for slow-op; check /slow and downstream."
